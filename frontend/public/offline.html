<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f3ec" />
  <title>Homeschooling</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f6f3ec; color: #1e2226;
           font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 88px; height: 88px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; max-width: 28rem; line-height: 1.5; }
    button { font: inherit; font-weight: 600; color: #fff; background: #2d5f54; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
    button:hover { background: #1f463e; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" />
    <h1>The home server is not answering.</h1>
    <p>Make sure the family computer is on, awake and running Homeschooling, and that this device is on the home Wi-Fi.</p>
    <button type="button" autofocus onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
